# collections/data/platform-postgres/secrets.yml
#
# postgres is the provider of the path most of the estate reads, which makes
# it the clearest case for the reader-blast-radius check: eight Services hold
# grants on secret/data/platform/postgres, so any self-roll on it would need
# acknowledgement. postgres itself only reads one key from it.
apiVersion: intent.jorisjonkers.dev/v1
kind: SecretAccess
service: platform-postgres

workloads:
  postgres:
    # For the postgres-exporter sidecar. delivery: env, matched by the
    # DATA_SOURCE_NAME placeholder in base.env.
    - path: secret/data/platform/postgres
      keys: [exporter.datasource]
      access: read
      delivery: env
      rotation: {tolerates: restart}

# Deliberately absent: the per-consumer credentials (kb.*, auth.*, agents.*,
# n8n.*). postgres does not read them -- its consumers do, each declaring its
# own grant. The Secret Subtree for this path is owned by the data domain and
# declares the readers, which is what makes "who breaks if I rotate this"
# answerable (ADR-0005).

# services/knowledge/platform/secrets.yml
#
# Owns access and file placement. Does NOT own env var names -- those live in
# the env files as ${secret:...} placeholders, and the two files check each
# other: a delivery: env grant with no placeholder is a dead grant, and a
# placeholder with no grant is an unauthorised reference.
apiVersion: intent.jorisjonkers.dev/v1
kind: SecretAccess
service: knowledge

workloads:
  knowledge-api:
    - path: secret/data/platform/postgres
      keys: [kb.user, kb.password]
      access: read
      delivery: env
      rotation: {tolerates: restart}

    - path: secret/data/platform/rabbitmq
      keys: [rabbitmq.user, rabbitmq.password]
      access: read
      delivery: env
      rotation: {tolerates: restart}

    # Per-device MCP bearer tokens. Every key is named, so adding a device is
    # a pull request here plus one line in the env file. That cost was
    # accepted for being able to answer, from the repository alone, which
    # variable carries which secret.
    - path: secret/data/knowledge-system/mcp-bearer
      keys: [workstation]
      access: read
      delivery: env
      rotation: {tolerates: restart}

  knowledge-ingest-worker:
    - path: secret/data/platform/rabbitmq
      keys: [rabbitmq.user, rabbitmq.password]
      access: read
      delivery: env
      rotation: {tolerates: restart}

    - path: secret/data/platform/postgres
      keys: [kb.user, kb.password]
      access: read
      delivery: env
      rotation: {tolerates: restart}

    # An SSH private key cannot be an environment variable. delivery: file is
    # the only option, and it is why file delivery exists at all.
    - path: secret/data/knowledge-system/vault-deploy-key
      keys: [key]
      access: read
      delivery: file
      mountAt: /home/worker/.ssh/id_ed25519
      fileMode: "0400"
      rotation: {tolerates: restart}

# services/auth-api/platform/secrets.yml
#
# The strongest validation of ADR-0005 in the estate: auth-api already runs
# delivery: self in production. Its live manifest carries
# SPRING_CONFIG_IMPORT: vault://, VAULT_AUTHENTICATION: KUBERNETES,
# VAULT_KUBERNETES_ROLE: auth-api and VAULT_DB_ENABLED: true, through
# libs/kotlin-spring-commons:vault.
apiVersion: intent.jorisjonkers.dev/v1
kind: SecretAccess
service: auth-api

workloads:
  auth-api:
    # Dynamic database credentials, re-read by the application at runtime.
    # The only combination achieving zero-downtime rotation: a pod's
    # environment is fixed for its lifetime, so tolerates: reload with
    # delivery: env would be a build error.
    - path: secret/data/platform/postgres
      keys: [auth.user, auth.password]
      access: read
      delivery: self
      rotation:
        tolerates: reload
        maxAge: 168h

    # The service's own configuration tree, already imported through
    # SPRING_CONFIG_IMPORT: vault:// today.
    - path: secret/data/auth-api
      keys: ['*']
      access: read
      delivery: self
      rotation: {tolerates: reload}

    # JWT signing through Vault Transit. auth-api rotates this key itself, so
    # self-roll rather than read -- which derives the `patch` capability on the
    # named key rather than `update`, so rolling it grants no read access to
    # anything else in the mount.
    - path: transit/keys/auth-api-jwt
      keys: [auth-api-jwt]
      access: self-roll
      delivery: self
      rotation: {tolerates: reload}
      # No rollAffectsReaders acknowledgement needed: composition shows no
      # other Service reads this key. Downstream verifiers fetch the public
      # key through JWKS, which follows a rotation rather than caching it.

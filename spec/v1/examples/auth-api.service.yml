# Worked example — services/auth-api/platform/service.yml
#
# Exercises: delivery: self with tolerates: reload (which auth-api already runs
# in production), a self-roll Transit grant, four dependencies, and config that
# is almost entirely derived.
#
# Companions: examples/auth-api.base.env, examples/auth-api.secrets.yml
apiVersion: intent.jorisjonkers.dev/v1
kind: Service
schemaVersion: 1.0.0

id: auth-api
domain: auth
owner: joris
alertClass: page          # every forward-auth protected route depends on this

provides:
  http: 8081

workloads:
  - name: auth-api
    lifecycle: service
    image: auth-api
    runtime: jvm

    dependsOn:
      - {service: platform-postgres, surface: postgres}
      - {service: platform-valkey,   surface: redis}
      - {service: platform-rabbitmq, surface: amqp}
      - {service: stalwart,          surface: smtp}

    exposure:
      - port: 8081
        # The login and registration surface must be reachable
        # unauthenticated -- auth-api is what performs authentication, so it
        # cannot sit behind it. The application enforces its own
        # authorization; this audience describes the edge only.
        audience: anonymous

    readiness:
      path: /api/actuator/health/readiness
      port: 8081
    liveness:
      path: /api/actuator/health/liveness
      port: 8081

    startupBudget: 600s
    zeroDowntime: true

    # PROPOSED FIELD -- chapter 10, "Still to be graded".
    # Live runs replicas: 2. The manifest records that as a capacity decision
    # on freed Frankfurt budget, not an availability requirement, and notes
    # deploys were already zero-downtime through maxUnavailable: 0. So the
    # availability requirement is 1 and the second replica is capacity.
    minAvailable: 1

    placement:
      requires: [public-ingress]

    scrape:
      port: 8081
      path: /api/actuator/prometheus

# GENERATED by the `rbac` adapter from the Aggregator's `deploys` list.
# Never hand-edited.
#
# This is what turns "deploy authority is exactly one" from a CI convention
# into an API-server control. A workflow that tries to apply a Service this
# Aggregator does not deploy receives 403 rather than producing a bad deploy.
#
# deploys: [auth-api, auth-ui]  ->  namespaces auth-system, app-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployer-auth-federation
  namespace: deploy-system
  labels:
    deploy.jorisjonkers.dev/aggregator: auth-federation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer-auth-federation
  namespace: auth-system
rules:
  # Exactly the kinds the `kubernetes`, `traefik`, `vso`, `prometheus`,
  # `networking` and `availability` adapters attribute to auth-api. Nothing
  # else, and no cluster-scoped verbs: an Aggregator cannot create a Namespace
  # or a CRD, because those belong to class B and to Flux.
  - apiGroups: ['']
    resources: [services, serviceaccounts, configmaps, persistentvolumeclaims]
    verbs: [get, list, create, patch, update, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, create, patch, update, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, create, patch, update, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, create, patch, update, delete]
  - apiGroups: [traefik.io]
    resources: [ingressroutes, middlewares]
    verbs: [get, list, create, patch, update, delete]
  - apiGroups: [secrets.hashicorp.com]
    resources: [vaultstaticsecrets, vaultdynamicsecrets]
    verbs: [get, list, create, patch, update, delete]
  - apiGroups: [monitoring.coreos.com]
    resources: [servicemonitors, podmonitors, prometheusrules]
    verbs: [get, list, create, patch, update, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployer-auth-federation
  namespace: auth-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer-auth-federation
subjects:
  - kind: ServiceAccount
    name: deployer-auth-federation
    namespace: deploy-system
